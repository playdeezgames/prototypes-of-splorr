<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jig Saw</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #1c2430; color: #f2e6d0; font: 13px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
  #stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px; }
  #screen { image-rendering: pixelated; touch-action: none; display: block; }
  footer { flex: 0 0 auto; text-align: center; padding: 6px 16px 10px; }
  footer a { color: #f2d75c; }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="384" height="240" aria-label="Jig Saw: the computer names a hidden puzzle piece and you name a square of the 4 by 4 board you think it covers. Tap squares or type their numbers."></canvas></div>
<footer>
  Jig Saw, a prototype by TheGrumpyGameDev after "Jig Saw" by David Bohlke (SoftSide, March 1979). Code and words made by an AI agent (Claude Code) at the author's direction. Font: Public Pixel by GGBotNet (CC0).<span class="ll-only" hidden> Feedback by LootLocker.</span><br>
  <span class="ll-only" hidden><a href="#" id="feedback-link">Send feedback</a> · </span><a href="../index.html">all prototypes</a> · <a href="https://thegrumpygamedev.itch.io/">itch.io</a> · <a href="https://playdeezgames.github.io/oeuvre-of-splorr/">more games</a>
</footer>
<script src="odin.js"></script>
<script src="lootlocker.js"></script>
<script src="shim.js"></script>
<script>
// Feedback (the shared SPLORR!! LootLocker form, splorr/Tech/LootLocker.md in the vault). Hidden until
// LL_KEY is filled in; making the LootLocker game is the user's call.
const LL_DOMAIN = "";
const LL_KEY = "";
const feedback = LL_KEY ? LootLocker({ domain: LL_DOMAIN, key: LL_KEY, version: "0.1.0", idKey: "jig-saw:ll-player" })
  .feedbackDialog({ game: "Jig Saw" }) : null;
if (feedback) {
  document.querySelectorAll(".ll-only").forEach((el) => { el.hidden = false; });
  document.getElementById("feedback-link").addEventListener("click", (e) => { e.preventDefault(); feedback.open(); });
}
startGame({ wasm: "game.wasm", width: 384, height: 240, storagePrefix: "jig-saw:" });
</script>
</body>
</html>
